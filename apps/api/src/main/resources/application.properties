spring.application.name=scent-api
server.address=${SCENT_BIND:127.0.0.1}
server.port=${SCENT_PORT:28049}
server.max-http-request-header-size=16KB
spring.datasource.url=${SCENT_DB_URL}
spring.datasource.username=${SCENT_DB_USER}
spring.datasource.password=${SCENT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.tomcat.max-http-form-post-size=32KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=6MB
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
logging.pattern.level=%5p [traceId=%X{traceId}]
springdoc.api-docs.enabled=${SCENT_DOCS:false}
springdoc.swagger-ui.enabled=${SCENT_DOCS:false}
scent.security.session-hours=${SCENT_SESSION_HOURS:8}
scent.security.cors-origins=${SCENT_CORS_ORIGINS:http://127.0.0.1:15183,http://127.0.0.1:15184}
scent.bootstrap.admin-login=${SCENT_ADMIN_LOGIN:}
scent.bootstrap.admin-password=${SCENT_ADMIN_PASSWORD:}
scent.order.timeout-minutes=${SCENT_ORDER_TIMEOUT_MINUTES:20}
scent.payment.app-id=${SCENT_ALIPAY_APP_ID:}
scent.payment.seller-id=${SCENT_ALIPAY_SELLER_ID:}
scent.payment.private-key-file=${SCENT_ALIPAY_PRIVATE_KEY_FILE:}
scent.payment.public-key-file=${SCENT_ALIPAY_PUBLIC_KEY_FILE:}
scent.payment.public-origin=${SCENT_PUBLIC_ORIGIN:http://127.0.0.1:15183}
scent.payment.notify-origin=${SCENT_NOTIFY_ORIGIN:}
scent.bailian.base-url=${SCENT_BAILIAN_BASE_URL:}
scent.bailian.agent-id=${SCENT_BAILIAN_AGENT_ID:}
scent.bailian.environment-id=${SCENT_BAILIAN_ENVIRONMENT_ID:}
scent.bailian.agent-version=${SCENT_BAILIAN_AGENT_VERSION:}
scent.bailian.mcp-server-id=${SCENT_BAILIAN_MCP_SERVER_ID:}
scent.bailian.key-file=${SCENT_BAILIAN_KEY_FILE:}
scent.mcp.token-file=${SCENT_MCP_TOKEN_FILE:}
scent.media.directory=${SCENT_MEDIA_DIRECTORY:}
